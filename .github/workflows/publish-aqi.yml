name: Publish latest AQI

# Every morning: load the last few days from the live API, then commit LATEST_AQI.md
# so anyone can read the results without signing in to GitHub.
on:
  schedule:
    - cron: "45 1 * * *"  # 07:15 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-aqi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-delta-3.2.1-spark-3.5.3
      - run: pip install -e .
      - name: Load the last 4 days from the API
        run: airlake --root /tmp/lh run --mode backfill --start "$(date -u -d '3 days ago' +%F)" --end "$(date -u +%F)"
      - name: Write LATEST_AQI.md
        run: |
          {
            echo "<!-- Generated by .github/workflows/publish-aqi.yml. Do not edit by hand. -->"
            echo
            echo "# Latest air quality in 10 Indian cities"
            echo
            echo "Updated $(TZ=Asia/Kolkata date '+%d %b %Y, %H:%M IST') by the daily pipeline run."
            echo
          } > LATEST_AQI.md
          airlake --root /tmp/lh show --markdown body.md
          sed '1,2d' body.md >> LATEST_AQI.md
          echo "$(cat LATEST_AQI.md)" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST_AQI.md
          git diff --cached --quiet || git commit -m "Update latest AQI"
          git push
